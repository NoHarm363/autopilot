[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditpilot-mas"
version = "0.1.0"
description = "Source-grounded MAS AML policy change monitoring for human audit review"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "PyMuPDF>=1.24,<2", "langgraph>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ui = ["streamlit>=1.45,<2"]
browser = ["playwright>=1.48,<2"]

[project.scripts]
auditpilot = "auditpilot.cli:main"

[tool.setuptools.packages.find]
include = ["auditpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
